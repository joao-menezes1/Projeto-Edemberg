{% extends 'sistemareservas/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-tag me-2"></i>Nova Categoria</h4>
                </div>
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="{{ form.nome.id_for_label }}" class="form-label">Nome da Categoria</label>
                            {{ form.nome }}
                            {% if form.nome.errors %}
                                <div class="invalid-feedback d-block">
                                    {% for error in form.nome.errors %}{{ error }}{% endfor %}
                                </div>
                            {% endif %}
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar Categoria</button>
                            <a href="{% url 'evento_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card-header { border-top-left-radius: calc(0.375rem - 1px); border-top-right-radius: calc(0.375rem - 1px); }
    .form-label { font-weight: 600; }
</style>
{% endblock %}
